name: Submit a Pack
description: Request a new pack to be added to the beyin registry
title: "[Pack] "
labels: ["pack-submission"]
body:
  - type: input
    id: name
    attributes:
      label: Pack name
      placeholder: e.g. My Favorite Tech Podcast, Best Cooking Blog, AI Research Papers
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What is this pack about? Who is it for?
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: YouTube video URLs or blog/article URLs — one per line
      placeholder: |
        https://youtube.com/watch?v=...
        https://example.com/blog/post
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated
      placeholder: e.g. ai, podcast, science
    validations:
      required: false

  - type: input
    id: author
    attributes:
      label: Your username
      placeholder: e.g. @username
    validations:
      required: false
