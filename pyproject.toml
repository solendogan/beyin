[project]
name = "brainpack"
version = "0.1.0"
description = "Turn trusted creators' content into searchable expert memory"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24.1",
    "trafilatura>=2.0.0",
    "nltk>=3.8",
    "sentence-transformers>=5.2.3",
    "chromadb>=1.5.5",
    "openai>=2.26.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
]

[project.scripts]
brainpack = "brainpack.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
