[project]
name = "beyin"
version = "0.2.7"
description = "Build local, queryable packs from videos, articles, podcasts, and files for MCP and local LLM use."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.24.1",
    "InquirerPy>=0.3.4",
    "mcp>=1.12.4",
    "trafilatura>=2.0.0",
    "nltk>=3.8",
    "fastembed>=0.7.3",
    "chromadb>=1.5.5",
    "openai>=2.26.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "yt-dlp>=2025.11.12",
    "feedparser>=6.0",
    "send2trash>=1.8",
    "faster-whisper>=1.0",
    'mlx-whisper>=0.4; sys_platform == "darwin"',
]

[project.scripts]
beyin = "beyin.cli:app"

[tool.hatch.build.targets.wheel]
exclude = [
  "/packs",
  "/benchmarks",
  "/tests",
  "/scripts",
  "/notes",
  "/.planning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
